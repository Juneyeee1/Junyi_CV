<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="陆俊伊的个人简历，在线查看或下载 PDF。">
  <meta name="referrer" content="no-referrer">
  <title>陆俊伊 · 个人简历</title>
  <style>
    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; color: #1f2328; background: #f6f8fa; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    header { max-width: 1028px; margin: 0 auto; padding: 34px 24px 26px; display: flex; align-items: center; justify-content: space-between; gap: 22px; }
    h1 { font-size: 24px; letter-spacing: .02em; margin: 0 0 7px; font-weight: 650; }
    .subtitle { color: #59636e; margin: 0; font-size: 14px; }
    nav { display: flex; gap: 10px; flex-wrap: wrap; }
    a { color: #0969da; text-decoration: none; }
    .button { display: inline-flex; align-items: center; justify-content: center; min-height: 42px; padding: 10px 17px; border: 1px solid #d1d9e0; border-radius: 7px; background: white; color: #1f2328; font-size: 14px; font-weight: 500; }
    .primary { background: #1f2328; border-color: #1f2328; color: white; }
    .button:hover { opacity: .82; }
    a:focus-visible { outline: 3px solid #0969da; outline-offset: 4px; }
    main { max-width: 980px; margin: 0 auto; background: white; border: 1px solid #d1d9e0; border-radius: 8px; overflow: hidden; box-shadow: 0 8px 32px #1f232808; }
    .resume { display: block; width: 100%; height: auto; }
    footer { padding: 22px 24px 34px; color: #59636e; text-align: center; font-size: 12px; line-height: 1.8; }
    @media (max-width: 640px) {
      header { align-items: flex-start; flex-direction: column; padding: 25px 18px 20px; gap: 17px; }
      h1 { font-size: 22px; }
      main { border-left: 0; border-right: 0; border-radius: 0; }
      .button { min-height: 44px; }
    }
    @media print { header, footer { display: none; } main { border: 0; box-shadow: none; max-width: none; } }
  </style>
</head>
<body>
  <header>
    <div><h1>陆俊伊 <span style="font-weight:400;color:#59636e">/ 简历</span></h1><p class="subtitle">AI 产品</p></div>
    <nav aria-label="简历文件"><a class="button" href="./resume.pdf" target="_blank" rel="noopener">查看 PDF</a><a class="button primary" href="./resume.pdf" download="陆俊伊-简历.pdf">下载简历</a></nav>
  </header>
  <main aria-label="简历预览"><a href="./resume.pdf" aria-label="打开陆俊伊的完整 PDF 简历"><img class="resume" src="./resume-preview.png" width="990" height="1400" alt="陆俊伊的简历，含教育经历、实习经历、工作经历和工作技能；文字版请打开 PDF。"></a></main>
  <footer>陆俊伊 · 个人简历<br>点击简历可查看 PDF 原件</footer>
</body>
</html>
